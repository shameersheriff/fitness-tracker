services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/apps/backend/prisma

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
